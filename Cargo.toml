[workspace]
members = ["crates/context-store", "crates/physical-manager", "crates/executor-sys", "crates/executor", "crates/model-registry", "crates/server", "crates/cli"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive", "env"] }
hex = "0.4.3"
jsonschema = { version = "0.18.3", default-features = false, features = ["draft202012"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
parking_lot = "0.12.5"
ureq = { version = "=3.0.12", default-features = false, features = ["rustls", "gzip"] }
reqwest = { version = "0.12.9", default-features = false, features = ["json", "rustls-tls"] }
url = "2.5.7"

tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.20.0", features = ["serde", "v4"] }