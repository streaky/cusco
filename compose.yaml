services:
  server:
    build:
      context: .
      target: production
      args:
        CUSCO_CUDA_ARCHITECTURES: "${CUSCO_CUDA_ARCHITECTURES:-61;70}"
    command:
      - /work/target/release/cusco
      - serve
      - "/data/models/${CUSCO_MODEL_FILE:-gemma-4-e2b-it.gguf}"
      - --model-id
      - "${CUSCO_MODEL_ID:-gemma-4-e2b-it}"
      - --model-family
      - "${CUSCO_MODEL_FAMILY:-gemma-4-e2b-it}"
      - --listen
      - 0.0.0.0:8080
      - --state
      - /data/state/cusco-state.json
      - --spill-directory
      - /data/spill
      - --device-bytes
      - "${CUSCO_DEVICE_BYTES:-8589934592}"
      - --host-bytes
      - "${CUSCO_HOST_BYTES:-17179869184}"
      - --storage-bytes
      - "${CUSCO_STORAGE_BYTES:-68719476736}"
      - --context-reserve-bytes
      - "${CUSCO_CONTEXT_RESERVE_BYTES:-1073741824}"
      - --context
      - "${CUSCO_CONTEXT_SIZE:-4096}"
      - --gpu-layers
      - "${CUSCO_GPU_LAYERS:-99}"
      - --require-competent
      - --bearer-token
      - "${CUSCO_BEARER_TOKEN:?set CUSCO_BEARER_TOKEN}"
    environment:
      CUSCO_REQUESTED_HOST_GPU: "${CUSCO_GPU_DEVICE_ID:-1}"
      LD_LIBRARY_PATH: /opt/llama-build/bin
#      CUSCO_HTTP_DEBUG: full
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/openapi.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    init: true
    restart: unless-stopped
    stop_grace_period: 35s
    ports:
      - "${CUSCO_LISTEN_ADDRESS:-127.0.0.1}:${CUSCO_PORT:-11443}:8080"
    volumes:
      - ./models:/data/models
      - ./data/state:/data/state
      - ./data/spill:/data/spill
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${CUSCO_GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
