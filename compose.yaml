services:
  server:
    build:
      context: ../..
      dockerfile: projects/cusco/Dockerfile
      target: production
      args:
        CUSCO_CUDA_ARCHITECTURES: "${CUSCO_CUDA_ARCHITECTURES:-61;70}"
    command:
      - /usr/local/bin/cusco-service
      - --config
      - /data/config.yaml
    environment:
      CUSCO_BEARER_TOKEN: "${CUSCO_BEARER_TOKEN:?set CUSCO_BEARER_TOKEN}"
      CUSCO_REQUESTED_HOST_GPU: "${CUSCO_GPU_DEVICE_ID:-0}"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error -H \"Authorization: Bearer $$CUSCO_BEARER_TOKEN\" \"http://127.0.0.1:8080/openai/v1/models\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    init: true
    restart: unless-stopped
    stop_grace_period: 35s
    ports:
      - "${CUSCO_LISTEN_ADDRESS:-127.0.0.1}:${CUSCO_PORT:-11443}:8080"
    volumes:
      - "${CUSCO_DATA_DIR:-./data}:/data"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${CUSCO_GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
