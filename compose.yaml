services:
  server:
    build:
      context: .
      target: production
      args:
        CUSCO_CUDA_ARCHITECTURES: "${CUSCO_CUDA_ARCHITECTURES:-61;70}"
    command:
      - /work/target/release/cusco
      - serve
      - --config
      - /data/config.yaml
    environment:
      CUSCO_BEARER_TOKEN: "${CUSCO_BEARER_TOKEN:?set CUSCO_BEARER_TOKEN}"
      CUSCO_REQUESTED_HOST_GPU: "${CUSCO_GPU_DEVICE_ID:-0}"
      LD_LIBRARY_PATH: /opt/llama-build/bin
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "-H", "Authorization: Bearer ${CUSCO_BEARER_TOKEN}", "http://127.0.0.1:8080/openai/v1/models"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    init: true
    restart: unless-stopped
    stop_grace_period: 35s
    ports:
      - "${CUSCO_LISTEN_ADDRESS:-127.0.0.1}:${CUSCO_PORT:-11443}:8080"
    volumes:
      - ./config/config.yaml:/data/config.yaml:ro
      - ./config/user.yaml:/data/user.yaml:ro
      - ./data/user-models:/data/user-models:ro
      - ./data/models:/data/models
      - ./data/db:/data/db
      - ./data/spill:/data/spill
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${CUSCO_GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
