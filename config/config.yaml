version: 1
listen: 0.0.0.0:8080
unsafe_public_unauthenticated: false
http_debug: off
openapi:
  ui:
    enabled: false
paths:
  database: /data/db/catalog.sqlite
  models: /data/models
  spill: /data/spill
  user_models: /data/user-models
  user_config: /data/user.yaml
execution:
  device_capacity: 8 GiB
  host_capacity: 16 GiB
  storage_capacity: 64 GiB
  context_reserve: 1 GiB
  context_tokens: 4096
  gpu_layers: 99
  require_competent: false
server:
  active_requests: 4
  queue_count: 32
  queue_bytes: 16777216
  request_bytes: 1048576
  pre_queue_concurrency: 16
  # Applied when an inference adapter omits max_tokens or max_output_tokens.
  default_output_tokens: 1024
  header_bytes: 32768
  body_timeout_ms: 10000
  wall_time_ms: 300000
  active_time_ms: 240000
  stream_buffer: 8
  shutdown_grace_ms: 30000
  compaction_enabled: true
  compaction_workers: 1
  compaction_declarations: 128
  compaction_declaration_rate_per_minute: 32
  compaction_declaration_lifetime_ms: 3600000
scheduler:
  version: 1
  interactive_weight: 4
  standard_weight: 2
  batch_weight: 1
  deficit_refill: 1
  prefill_tokens: 32
  promotion_rounds: 64
  diagnostic_capacity: 1024
vision:
  max_images: 8
  max_encoded_bytes: 16777216
  max_decoded_bytes: 12582912
  max_dimension: 8192
  max_total_pixels: 32000000
  retention_capacity: 256 MiB
  metadata_allowlist: []
