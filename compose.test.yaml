name: cusco-test

services:
  test:
    build: &test-build
      context: .
      target: development
    command: ["tools/coverage.sh"]
    volumes:
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
      - cargo-target:/work/target
  acceptance-model-free:
    build: *test-build
    command: ["python3", "tools/acceptance-report.py", "--mode", "model-free"]
    environment:
      CUSCO_RESULT_DIR: "/results"
    volumes:
      - "${CUSCO_RESULT_DIR:-./results}:/results"
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
      - cargo-target:/work/target

  model-fetch:
    build: *test-build
    command:
      - cargo
      - run
      - -p
      - cusco
      - --
      - fetch
      - hf://unsloth/gemma-4-E2B-it-GGUF/gemma-4-E2B-it-Q3_K_M.gguf
      - --cache
      - /data/models
    volumes:
      - "${CUSCO_MODEL_DIR:-./data/models}:/data/models"
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
      - cargo-target:/work/target
  executor-proof:
    build: *test-build
    command: ["sh", "-c", "nvidia-smi --query-gpu=uuid --format=csv,noheader && cargo run -p cusco -- proof 'hf://unsloth/gemma-4-E2B-it-GGUF/gemma-4-E2B-it-Q3_K_M.gguf'"]
    environment:
      CUSCO_MODEL_CACHE: "/data/models"
      CUSCO_REQUESTED_HOST_GPU: "${CUSCO_GPU_DEVICE_ID:-1}"
      LD_LIBRARY_PATH: "/opt/llama-build/bin"
    volumes:
      - "${CUSCO_MODEL_DIR:-./data/models}:/data/models:ro"
      - "${CUSCO_RESULT_DIR:-./results}:/results"
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
      - cargo-target:/work/target
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, device_ids: ["${CUSCO_GPU_DEVICE_ID:-1}"], capabilities: [gpu] }] } } }
  mapped-proof:
    build: *test-build
    command: ["sh", "-c", "nvidia-smi --query-gpu=uuid,name,compute_cap --format=csv,noheader > /results/mapped-proof-gpu.csv && cargo run -p cusco -- mapped-proof 'hf://unsloth/gemma-4-E2B-it-GGUF/gemma-4-E2B-it-Q3_K_M.gguf'"]
    environment:
      CUSCO_MODEL_CACHE: "/data/models"
      CUSCO_REQUESTED_HOST_GPU: "${CUSCO_GPU_DEVICE_ID:-1}"
      LD_LIBRARY_PATH: "/opt/llama-build/bin"
    volumes:
      - "${CUSCO_MODEL_DIR:-./data/models}:/data/models:ro"
      - "${CUSCO_RESULT_DIR:-./results}:/results"
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
      - cargo-target:/work/target
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, device_ids: ["${CUSCO_GPU_DEVICE_ID:-1}"], capabilities: [gpu] }] } } }
  representation-proof:
    build: *test-build
    command: ["sh", "-c", "nvidia-smi --query-gpu=uuid,name,compute_cap --format=csv,noheader > /results/representation-proof-gpu.csv && cargo run -p cusco -- representation-proof 'hf://unsloth/gemma-4-E2B-it-GGUF/gemma-4-E2B-it-Q3_K_M.gguf'"]
    environment:
      CUSCO_MODEL_CACHE: "/data/models"
      CUSCO_REQUESTED_HOST_GPU: "${CUSCO_GPU_DEVICE_ID:-1}"
      LD_LIBRARY_PATH: "/opt/llama-build/bin"
    volumes:
      - "${CUSCO_MODEL_DIR:-./data/models}:/data/models:ro"
      - "${CUSCO_RESULT_DIR:-./results}:/results"
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
      - cargo-target:/work/target
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, device_ids: ["${CUSCO_GPU_DEVICE_ID:-1}"], capabilities: [gpu] }] } } }


  acceptance:
    depends_on:
      model-fetch:
        condition: service_completed_successfully
    build: *test-build
    command:
      - python3
      - tools/acceptance-report.py
      - --mode
      - real-model
      - --model
      - hf://unsloth/gemma-4-E2B-it-GGUF/gemma-4-E2B-it-Q3_K_M.gguf
    environment:
      CUSCO_REQUESTED_HOST_GPU: "${CUSCO_GPU_DEVICE_ID:-1}"
      CUSCO_RESULT_DIR: "/results"
      LD_LIBRARY_PATH: "/opt/llama-build/bin"
    volumes:
      - "${CUSCO_MODEL_DIR:-./data/models}:/data/models"
      - "${CUSCO_RESULT_DIR:-./results}:/results"
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
      - cargo-target:/work/target
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, device_ids: ["${CUSCO_GPU_DEVICE_ID:-1}"], capabilities: [gpu] }] } } }

  api-smoke:
    depends_on:
      model-fetch:
        condition: service_completed_successfully
    build: *test-build
    command:
      - sh
      - -c
      - >-
        mkdir -p /data/db /data/spill /data/user-models /data/models &&
        printf 'models: []\n' > /data/user.yaml &&
        CUSCO_BEARER_TOKEN=smoke-report-token cargo run -p cusco -- serve
        --config /work/config/test.yaml &
        server=$$!; trap 'kill $$server' EXIT;
        until curl -sf -H 'Authorization: Bearer smoke-report-token'
        http://127.0.0.1:8080/cusco/v1/status >/dev/null; do
        kill -0 $$server || exit 1; sleep 1; done;
        CUSCO_SMOKE_BASE_URL=http://127.0.0.1:8080
        CUSCO_SMOKE_OUTPUT=/results/smoke-report.json
        CUSCO_SMOKE_TOKEN=smoke-report-token python3 tools/smoke-report.py
    environment:
      CUSCO_REQUESTED_HOST_GPU: "${CUSCO_GPU_DEVICE_ID:-1}"
      LD_LIBRARY_PATH: "/opt/llama-build/bin"
    volumes:
      - "${CUSCO_USER_MODEL_DIR:-./data/user-models}:/data/user-models:ro"
      - "${CUSCO_MODEL_DIR:-./data/models}:/data/models"
      - "${CUSCO_RESULT_DIR:-./results}:/results"
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
      - cargo-target:/work/target
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, device_ids: ["${CUSCO_GPU_DEVICE_ID:-1}"], capabilities: [gpu] }] } } }

  oai-lens-server:
    depends_on:
      model-fetch:
        condition: service_completed_successfully
    build: *test-build
    command:
      - sh
      - -c
      - >-
        touch crates/server/src/*.rs crates/cli/src/*.rs &&
        mkdir -p /data/db /data/spill /data/user-models /data/models &&
        printf 'models: []\n' > /data/user.yaml &&
        CUSCO_BEARER_TOKEN=smoke-report-token cargo run -p cusco -- serve
        --config /work/config/test.yaml &
        server=$$!; trap 'kill $$server' EXIT;
        until curl -sf -H 'Authorization: Bearer smoke-report-token'
        http://127.0.0.1:8080/cusco/v1/status >/dev/null; do
        kill -0 $$server || exit 1; sleep 1; done;
        curl -sf -H 'Authorization: Bearer smoke-report-token'
        -H 'Content-Type: application/json'
        -d '{"name":"hf://unsloth/gemma-4-E2B-it-GGUF/gemma-4-E2B-it-Q3_K_M.gguf","stream":false}'
        http://127.0.0.1:8080/cusco/v1/api/pull >/dev/null &&
        touch /tmp/oai-lens-ready &&
        wait $$server
    environment:
      CUSCO_REQUESTED_HOST_GPU: "${CUSCO_GPU_DEVICE_ID:-1}"
      LD_LIBRARY_PATH: "/opt/llama-build/bin"
    volumes:
      - "${CUSCO_USER_MODEL_DIR:-./data/user-models}:/data/user-models:ro"
      - "${CUSCO_MODEL_DIR:-./data/models}:/data/models"
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
      - cargo-target:/work/target
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/oai-lens-ready"]
      interval: 2s
      timeout: 1s
      retries: 300
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, device_ids: ["${CUSCO_GPU_DEVICE_ID:-1}"], capabilities: [gpu] }] } } }

  oai-lens:
    depends_on:
      oai-lens-server:
        condition: service_healthy
    build:
      context: .tools/oai-lens
    entrypoint: ["python3", "/cusco/tools/oai-lens-gate.py"]
    command:
      - --report
      - /results/oai-lens-report.json
      - --gate-report
      - /results/oai-lens-gate.json
      - --expectations
      - /cusco/config/oai-lens-expectations.json
      - --revision-file
      - /cusco/oai-lens-version.txt
      - --
      - oai-lens
      - --config
      - /config/oai-lens.yaml
      - test
    environment:
      CANDIDATE_API_KEY: "${CUSCO_OAI_LENS_TOKEN:-smoke-report-token}"
    volumes:
      - ./config/oai-lens.yaml:/config/oai-lens.yaml:ro
      - ./.tools/oai-lens/fixtures:/app/.venv/lib/python3.12/site-packages/fixtures:ro
      - ./config/oai-lens-expectations.json:/cusco/config/oai-lens-expectations.json:ro
      - ./oai-lens-version.txt:/cusco/oai-lens-version.txt:ro
      - ./tools/oai-lens-gate.py:/cusco/tools/oai-lens-gate.py:ro
      - "${CUSCO_RESULT_DIR:-./results}:/results"

volumes:
  cargo-registry:
  cargo-git:
  cargo-target:
